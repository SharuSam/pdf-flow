<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#142c28"><title>PDF Flow · 나만의 읽기 속도</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head>
<body><div id="app"><header><a class="brand" href="./">PDF <em>Flow</em><span>나만의 읽기 속도</span></a><div class="actions"><button id="install" hidden>앱 설치</button><label class="file-button">PDF 열기<input id="file" type="file" accept="application/pdf,.pdf"></label></div></header>
<main id="viewer" tabindex="0" aria-label="PDF 읽기 영역"><section id="welcome"><div class="eyebrow">READ AT YOUR OWN PACE</div><h1>화면은 천천히.<br>읽기는 편안하게.</h1><p>PDF를 열고 속도를 정하세요.<br>손으로 넘기지 않아도, 읽기는 계속됩니다.</p><label class="drop" for="file"><span class="paper-icon">↓</span><strong>PDF 파일 선택</strong><span>또는 이곳에 파일을 끌어 놓으세요</span><small>파일은 이 기기에서만 처리됩니다.</small></label><button id="demo" class="subtle">샘플 PDF로 먼저 살펴보기 ↗</button><div class="features"><span>01 &nbsp; 화면 폭에 맞게</span><span>02 &nbsp; 원하는 속도로</span><span>03 &nbsp; 어디서나 편안하게</span></div></section><div id="pages"></div></main>
<div id="notice" role="status" aria-live="polite">PDF를 열어 시작하세요.</div><footer><div class="document"><strong id="filename">아직 열린 PDF가 없습니다</strong><span id="position">준비됨</span></div><div class="speed"><label for="speed">스크롤 속도 <output id="speedValue">40 px/s</output></label><input id="speed" type="range" min="5" max="180" value="40" step="5"><div class="range-label"><span>천천히</span><span>빠르게</span></div></div><div class="controls"><button id="top" disabled aria-label="처음으로">↑ 처음</button><button id="play" class="primary" disabled>▶ 시작</button><button id="full" disabled aria-label="전체화면 전환">⛶</button></div></footer></div><script type="module" src="app.mjs"></script></body></html>
